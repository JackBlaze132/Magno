plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.unibegue'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'com.microsoft.sqlserver:mssql-jdbc:12.8.1.jre11'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	implementation 'org.apache.httpcomponents:httpclient:4.5.14'
	implementation 'org.apache.httpcomponents.client5:httpclient5:5.4.1'
	implementation 'org.apache.poi:poi-ooxml:5.4.0'
	implementation 'org.hibernate.common:hibernate-commons-annotations:6.0.6.Final'
	implementation 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.0'
	implementation 'org.glassfish.jaxb:jaxb-runtime:4.0.4'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	implementation("org.springframework.security:spring-security-core:6.5.0")
	implementation("io.jsonwebtoken:jjwt-api:0.12.6")
	implementation("com.auth0:java-jwt:4.5.0")
	implementation 'com.google.api-client:google-api-client:2.5.0'
	implementation 'com.google.http-client:google-http-client-jackson2:1.44.1'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation("com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10")
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly("io.jsonwebtoken:jjwt-api:0.12.6")
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc:12.6.1.jre11'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation("org.junit.jupiter:junit-jupiter:5.9.3")
	testImplementation("org.mockito:mockito-core:5.16.1")
	testImplementation("org.mockito:mockito-junit-jupiter:5.16.1")
	testImplementation("org.assertj:assertj-core:3.27.3")
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

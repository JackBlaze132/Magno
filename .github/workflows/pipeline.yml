name: Unified CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Verify Environment
        run: |
          echo "Preparing the build environment..."
          ls -R

  test-back:
    name: Test Backend
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run Backend Tests
        env:
          SPRING_PROFILES_ACTIVE: test
          JDBC_DATABASE_USERNAME: sa
          JDBC_DATABASE_URL: jdbc:h2:mem:testdb
          INTEGRA_BASE_URL: http://localhost:8081
          INTEGRA_ACADEMIC_PROGRAMS_URL: http://localhost:8081/programs
          INTEGRA_ACADEMIC_PROGRAMS_ACADEMIA_URL: http://localhost:8081/academia
          INTEGRA_STUDENT_URL_1: http://localhost:8081/student1
          INTEGRA_STUDENT_URL_2: http://localhost:8081/student2
          INTEGRA_STUDENT_URL_ALL: http://localhost:8081/students
          INTEGRA_ALL_FUNCTIONARIES_URL: http://localhost:8081/functionaries
          INTEGRA_ALL_DEPENDENCIES_URL: http://localhost:8081/dependencies
          INTEGRA_API_TOKEN: test-token
          GOOGLE_CLIENT_ID: test-client-id
          GOOGLE_CLIENT_SECRET: test-client-secret
          FRONTEND_LOGIN_URL: http://localhost:3000/login
          FRONTEND_SUCCESS_URL: http://localhost:3000/
        run: |
          cd backend
          chmod +x gradlew
          ./gradlew test

  test-front:
    name: Test Frontend
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Prepare environment (VPN)
        run: sudo apt-get update && sudo apt-get install -y openconnect
      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
          --protocol=gp \
          --user=${{ secrets.VPN_USER }} \
          --passwd-on-stdin \
          --servercert pin-sha256:${{ secrets.SERVER_CERT }} \
          ${{ secrets.VPN_HOST }} -b
          sleep 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Run Lint
        run: npm run lint
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Frontend Tests
        run: npm run test

  deploy-back:
    name: Deploy Backend
    needs: test-back
    runs-on: ubuntu-latest
    steps:
      - name: Prepare environment (VPN & SSH)
        run: sudo apt-get update && sudo apt-get install -y openconnect sshpass
      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
          --protocol=gp \
          --user=${{ secrets.VPN_USER }} \
          --passwd-on-stdin \
          --servercert pin-sha256:${{ secrets.SERVER_CERT }} \
          ${{ secrets.VPN_HOST }} -b
          sleep 10
      - name: Deploy to Remote Server
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} << 'EOF'
            set -e
            cd ~/magno/ || exit;
            if [ ! -d ".git" ]; then
              git clone git@github.com:JackBlaze132/Magno.git . || (git init && git remote add origin git@github.com:JackBlaze132/Magno.git && git pull origin main)
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            cd backend
            
            # Stop existing Java processes with 'magno' and existing Gradle daemons
            echo "Stopping existing applications and Gradle daemons..."
            pkill -f 'magno' || true
            ./gradlew --stop || true
            sleep 2
            
            chmod +x gradlew
            # Build without daemon to avoid memory issues and lock file conflicts
            ./gradlew clean build -x test --no-daemon
            
            mkdir -p logs
            # Create the .env.prod file from the GitHub Secret
            echo "${{ secrets.APP_ENV_PROD }}" > .env.prod

            echo "Starting Spring Boot application with Java 21..."
            # Load variables safely (handles special characters like & in URLs)
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ ! -z "$line" && ! "$line" =~ ^# ]]; then
                export "$line"
              fi
            done < .env.prod
            
            # Use Java 21 explicitly
            export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
            export PATH=$JAVA_HOME/bin:$PATH
            
            nohup java -jar build/libs/magno-0.0.1-SNAPSHOT.jar > logs/app.log 2>&1 &
            
            echo "Backend started."
            echo "Logs available at: ~/magno/backend/logs/app.log"
          EOF

  deploy-front:
    name: Deploy Frontend
    needs: test-front
    runs-on: ubuntu-latest
    steps:
      - name: Prepare environment (VPN & SSH)
        run: sudo apt-get update && sudo apt-get install -y openconnect sshpass
      - name: Connect to VPN
        run: |
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect \
          --protocol=gp \
          --user=${{ secrets.VPN_USER }} \
          --passwd-on-stdin \
          --servercert pin-sha256:${{ secrets.SERVER_CERT }} \
          ${{ secrets.VPN_HOST }} -b
          sleep 10
      - name: Deploy to Remote Server
        run: |
          sshpass -p "${{ secrets.INTERNAL_SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.INTERNAL_USER }}@${{ secrets.INTERNAL_RESOURCE_IP }} << 'EOF'
            set -e
            cd ~/magno/ || exit;
            if [ ! -d ".git" ]; then
              git clone git@github.com:JackBlaze132/Magno.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            cd frontend
            # Create the .env.production file for Vite build
            echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env.production
            
            npm install
            npm run build
            
            export PATH=$PATH:/usr/local/nodejs/bin
            if pm2 list | grep -q 'Front_Magno'; then
              pm2 restart Front_Magno
            else
              pm2 start 'npx -y serve -s dist -p 3000' --name Front_Magno
            fi
          EOF

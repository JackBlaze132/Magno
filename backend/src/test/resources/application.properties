# Test configuration using H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Mocking external values for tests
SPRING_PROFILES_ACTIVE=test
JDBC_DATABASE_USERNAME=test
JDBC_DATABASE_PASSWORD=test
JDBC_DATABASE_URL=jdbc:h2:mem:testdb
INTEGRA_BASE_URL=http://localhost:8081
INTEGRA_ACADEMIC_PROGRAMS_URL=http://localhost:8081/programs
INTEGRA_ACADEMIC_PROGRAMS_ACADEMIA_URL=http://localhost:8081/academia
INTEGRA_STUDENT_URL_1=http://localhost:8081/student1
INTEGRA_STUDENT_URL_2=http://localhost:8081/student2
INTEGRA_STUDENT_URL_ALL=http://localhost:8081/students
INTEGRA_ALL_FUNCTIONARIES_URL=http://localhost:8081/functionaries
INTEGRA_ALL_DEPENDENCIES_URL=http://localhost:8081/dependencies
INTEGRA_API_TOKEN=test-token
GOOGLE_CLIENT_ID=test-id
GOOGLE_CLIENT_SECRET=test-secret
FRONTEND_LOGIN_URL=http://localhost:3000/login
FRONTEND_SUCCESS_URL=http://localhost:3000/
